<!doctype html>
<html lang="en">
    <template class="card-template">
        <div class="card row col-4" style="width: 18rem; margin:10px; padding:10px;">
        <div class="product-container"></div>
            <div class="product-image"></div>
            <div class="product-title"></div>
            <div class="product-price"></div>
            <div class="product-description"></div>
        </div>
        </div>      
    </template>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.1/dist/echarts.min.js"></script>
    <style>
        .header {
            width: 50%;
            margin: 10px;
            padding: 10px;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            font-family: Arial, sans-serif;
            border: 1px solid #000000;
            background-color: #82eaff;
            border-radius: 5px;
        }
        .title {
            text-shadow: 5px 5px 5px #000000;
            color: #ffffff;
            -webkit-text-stroke: 1px #000000;
            margin: 0;
        }
        .subtitle {
            text-align: center;
            margin: 0;
            font-size: 1rem;
        }
        .card {
            margin: 10px;
            padding: 10px;
        }
        #dropdown {
            margin: 10px;
            cursor: pointer;
            background-color: #e4e4e4;
            border: 1px solid #000000;
            border-radius: 5px;
            padding: 5px 10px;
        }
        #dropdown-menu {
            margin: 10px;
            padding: 0;
            list-style-type: none;
            border: 1px solid #000000;
            border-radius: 5px;
            background-color: #e4e4e4;
        }
        #dropdown-menu li {
            padding: 5px 10px;
            cursor: pointer;
        }
        #dropdown-menu li:hover {
            background-color: #d4d4d4;
        }
        #card-list {
            justify-content: center;
        }
        
    </style>
    
  </head>
  <body>
    <header class="header">
        <h1 class="title">Fake Store Online</h1>
        <h3 class="subtitle">For all the products you can't get anywhere... including here!</h3>
        <main>
        <button id="dropdown">Filter</button>
            <ul id="dropdown-menu" style="display: none;">
                <li>Apparel</li>
                <li>Electronics</li>
                <li>Jewelery</li>
                <li>Men's Clothing</li>
                <li>Women's Clothing</li>
            </ul>
        <div><input type="text" id="search-input" placeholder="Search products..." /></div>
    </main>
    </header>
    
    
    <div id="card-list" class="row"></div>
    <script type="text/javascript">
      let options = {
        title: { text: "Fake Store Categories" },
        xAxis: {
          data: ["Category 1", "Category 2", "Category 3", "Category 4"],
        },
        yAxis: {},
        series: [
          {
            name: "# products",
            type: "bar",
            data: [0, 1, 5, 2],
          },
        ],
      };
      fetch("https://fakestoreapi.com/products")
        .then((response) => response.json())
        .then((json) => {
          console.log(json);
          json.forEach((product) => {
            let template = document.querySelector(".card-template");
            let clone = template.content.cloneNode(true);
            clone.querySelector(".product-image").innerHTML = `<img src="${product.image}" alt="${product.title}" style="width: 100px; heigth: 100px;" />`;
            clone.querySelector(".product-title").textContent = product.title;
            clone.querySelector(".product-price").textContent = `$${product.price}`;
            clone.querySelector(".product-description").textContent = product.description;
            document.getElementById("card-list").appendChild(clone);
          });
        });
        document.getElementById("dropdown").addEventListener("click", () => {
                const menu = document.getElementById("dropdown-menu");
                menu.style.display = menu.style.display === "none" ? "block" : "none";
            });




    </script>
  </body>
</html>
