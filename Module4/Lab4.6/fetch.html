<!doctype html>
<html lang="en">
  <template id="card-template">
      <div class="card row col-8" style="width: 18rem; margin:10px">
        <div class="card-body">
          <h5 class="card-title">Card title</h5>
          <p class="card-text">Card text.</p>
        </div>
      </div>
    </template>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,
initial-scale=1"
    />
    <title>Fetch</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9"
      crossorigin="anonymous"
    />
    
  </head>
  <body>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
      crossorigin="anonymous"
    ></script>

    <main>
      <div id="card-list" class="row"></div>
    </main>

  <script>
    fetch("https://jsonplaceholder.typicode.com/posts?_limit=10", {
      method: "GET",
    })
      .then((response) => response.json())
      .then((json) => {
        console.log(json);
        json.forEach((post) => addCard(post));
      });
    function addCard(post) {
      const template = document.querySelector("#card-template").content.cloneNode(true);
      template.querySelector(".card-title").textContent = post.title;
      template.querySelector(".card-text").textContent = post.body;
      document.querySelector("#card-list").appendChild(template);
    }
    addCard().then( (post) => post.forEach((p) => addCard(p)));
    
  </script>
</html>
