<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In box</title>
    <style>
      .landing {
        background-image: url("background-dnd.jpg");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 90vh;
        background-color: #010101;
      }
      form {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 60%;
        box-sizing: border-box;
        margin-left: auto;
        margin-right: auto;
        text-align: left;
        width: 300px;
        padding: 5px;
        margin-top: 20px;
        background-color: rgba(202, 202, 202, 0.635);
        border-radius: 10px;
      }
      .title {
        color: rgb(252, 147, 147);
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.966);
        -webkit-text-stroke: 1px #010101aa;
        text-align: center;
      }
      .please {
        color: rgb(150, 159, 253);
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.966);
        -webkit-text-stroke: 1px #010101aa;
        text-align: center;
      }
    </style>
  </head>
  <body class="landing">
    <form action="#" method="post">
      <h2 class="title">
        Welcome to Dungeons and Dragons <br />Character Creator!
      </h2>
      <h2 class="please">Please Sign In</h2>
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" required />
      <br />
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required />
      <br />
      <button type="submit">Sign In</button>
      <p>
        Don't have an account?
        <a href="signup.html">Sign Up</a>
      </p>
    </form>
  </body>
</html>
